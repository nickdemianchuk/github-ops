name: tf-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"

jobs:
  tf-validate:
    name: tf-validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.x"
      - run: terraform init -backend=false
      - run: terraform validate

  tf-plan:
    name: tf-plan
    runs-on: ubuntu-24.04
    needs: tf-validate
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ secrets.TF_WORKSPACE }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.x"
      - run: terraform init
        env:
          TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
      - id: plan
        run: terraform plan -no-color 2>&1 | tee plan.txt; echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        continue-on-error: true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const body = plan.length > 60000
              ? `## Terraform Plan\n\`\`\`\n${plan.substring(0, 60000)}\n...(truncated)\n\`\`\``
              : `## Terraform Plan\n\`\`\`\n${plan}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
      - if: steps.plan.outputs.exitcode != '0'
        run: exit 1
