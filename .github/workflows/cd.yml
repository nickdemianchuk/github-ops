name: cd

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  release:
    if: "${{ github.ref_type == 'branch' && !startsWith(github.event.head_commit.message, 'chore: release') }}"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: nickdemianchuk/actions/.github/workflows/release.yml@main
    with:
      use_app_token: true
    secrets:
      APP_CLIENT_ID: ${{ vars.OCTO_BUDDY_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.OCTO_BUDDY_PRIVATE_KEY }}

  tf-apply:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: nickdemianchuk/actions/.github/workflows/tf-apply.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      workspace: ${{ github.event.repository.name }}
    secrets:
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      TF_VAR_octo_buddy_private_key: ${{ secrets.TF_VAR_octo_buddy_private_key }}
