name: cd

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  release:
    if: github.ref_type == 'branch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: nickdemianchuk/actions/.github/workflows/release.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  tf-apply:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: nickdemianchuk/actions/.github/workflows/tf-apply.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      workspace: ${{ github.event.repository.name }}
    secrets:
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
